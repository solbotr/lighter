[project]
name = "lighter-news-trader"
version = "0.1.0"
description = "News-driven crypto trading research and risk engine for Lighter"
requires-python = ">=3.10"
dependencies = [
  "lighter-sdk @ git+https://github.com/elliottech/lighter-python.git",
  "pydantic>=2",
  "httpx>=0.27",
  "feedparser>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
