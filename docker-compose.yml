version: '3.8'

# Lighter news sniper stack (live by default).
# Key env vars (see .env.lighter.example):
#   LIGHTER_BASE_URL, LIGHTER_ACCOUNT_INDEX, LIGHTER_API_KEY_INDEX,
#   LIGHTER_API_PRIVATE_KEY, NEWS_KILL_SWITCH, TELEGRAM_TOKEN, ADMIN_CHAT_ID,
#   LIGHTER_LIVE, DRY_RUN_DEFAULT=false, NEWS_PROMOTION_MODE=live

services:
  lighter-bot:
    build: .
    container_name: lighter-bot
    restart: always
    environment:
      - LIGHTER_BASE_URL=${LIGHTER_BASE_URL:-https://mainnet.zklighter.elliot.ai}
      - LIGHTER_ACCOUNT_INDEX=${LIGHTER_ACCOUNT_INDEX:-}
      - LIGHTER_API_KEY_INDEX=${LIGHTER_API_KEY_INDEX:-}
      - LIGHTER_API_PRIVATE_KEY=${LIGHTER_API_PRIVATE_KEY:-}
      - MM_ENABLED=${MM_ENABLED:-0}
      - MM_BOT_ARGS=${MM_BOT_ARGS:---live}
      - LIGHTER_MM_ACCOUNT_INDEX=${LIGHTER_MM_ACCOUNT_INDEX:-}
      - LIGHTER_MM_API_KEY_INDEX=${LIGHTER_MM_API_KEY_INDEX:-}
      - LIGHTER_MM_API_PRIVATE_KEY=${LIGHTER_MM_API_PRIVATE_KEY:-}
      - LIGHTER_MM_DB_PATH=${LIGHTER_MM_DB_PATH:-/app/data/lighter_mm.db}
      - LIGHTER_LIVE=${LIGHTER_LIVE:-true}
      - DRY_RUN_DEFAULT=${DRY_RUN_DEFAULT:-false}
      - NEWS_PROMOTION_MODE=${NEWS_PROMOTION_MODE:-live}
      - NEWS_KILL_SWITCH=${NEWS_KILL_SWITCH:-false}
      - NEWS_FORCE_LIVE=${NEWS_FORCE_LIVE:-true}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID:-}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - NEWS_DB_PATH=${NEWS_DB_PATH:-/app/data/lighter_news.db}
    volumes:
      - ./data:/app/data
      # Optional: mount a host .env for local secrets (never bake into the image)
      - ./.env:/app/.env:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import lighter_news_sniper"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: lighter-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: lighter-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
